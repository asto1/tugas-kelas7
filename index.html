<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Monitoring Tugas Siswa</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 20px;
}

h2 {
  text-align: center;
}

.info {
  text-align: center;
  color: #666;
  margin-bottom: 20px;
}

.summary {
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px auto;
  border-radius: 10px;
  max-width: 600px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.nama {
  font-weight: bold;
  margin-bottom: 8px;
}

.kurang {
  color: red;
}

.done {
  text-align:center;
  color: green;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>📊 Monitoring Tugas Siswa</h2>
<div class="info">Auto sinkron dari Google Sheets</div>

<div id="hasil">⏳ Memuat data...</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/1Ldjko3p6M3XaUdi-uS9xZ-DhQpddddZYJNVVO_P2c-M/export?format=csv";

loadData();
setInterval(loadData, 15000);

// ================= LOAD =================
async function loadData() {
  try {
    const res = await fetch(URL);
    const text = await res.text();

    const data = parseCSV(text);
    prosesData(data);

  } catch (e) {
    document.getElementById("hasil").innerHTML = "❌ Gagal mengambil data";
  }
}

// ================= PARSER CSV =================
function parseCSV(text) {
  const rows = text.split("\n").map(r =>
    r.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
  );

  // cari header yang mengandung "nama"
  const headerIndex = rows.findIndex(r =>
    r && r.some(c => c && c.toLowerCase().includes("nama"))
  );

  const headers = rows[headerIndex].map(h =>
    h ? h.replace(/"/g,"").trim() : ""
  );

  return rows.slice(headerIndex + 1).map(row => {
    let obj = {};
    headers.forEach((h, i) => {
      if (h) {
        obj[h] = row[i] ? row[i].replace(/"/g,"").trim() : "";
      }
    });
    return obj;
  });
}

// ================= HELPER =================
function belumTuntas(val) {
  if (!val) return true;

  val = val.toString().trim().toLowerCase();

  // nilai dianggap tuntas
  if (val === "1" || val === "✓" || val === "v" || val === "done") {
    return false;
  }

  return (
    val === "" ||
    val === "0" ||
    val === "-" ||
    val === "null"
  );
}

// ambil nama dengan fallback aman
function ambilNama(row) {
  const keys = Object.keys(row);

  // cari kolom "nama"
  const keyNama = keys.find(k =>
    k.toLowerCase().includes("nama")
  );

  if (keyNama && row[keyNama]) {
    return row[keyNama];
  }

  // fallback: kolom ke-2 (biasanya NAMA)
  if (keys.length > 1) {
    return row[keys[1]];
  }

  return "-";
}

// ambil nilai fleksibel
function getVal(row, key) {
  const found = Object.keys(row).find(k =>
    k.toLowerCase().includes(key.toLowerCase())
  );
  return found ? row[found] : "";
}

// ================= PROSES =================
function prosesData(data) {
  const hasil = data.map(row => {
    let kurang = [];

    if (belumTuntas(getVal(row, "6.6"))) {
      kurang.push("Mengerjakan aktivitas 6.6 dan 6.7 hal 21");
    }

    if (belumTuntas(getVal(row, "Catatan"))) {
      kurang.push("Mencatat dan meringkas hal 8–21");
    }

    let asesmen = [];
    if (belumTuntas(getVal(row,"I"))) asesmen.push("I");
    if (belumTuntas(getVal(row,"II"))) asesmen.push("II");
    if (belumTuntas(getVal(row,"III"))) asesmen.push("III");

    if (asesmen.length > 0) {
      kurang.push(`Mengerjakan asesmen ${asesmen.join(", ")} (hal 29–31)`);
    }

    return {
      nama: ambilNama(row),
      kurang
    };
  }).filter(s => s.kurang.length > 0);

  tampilkan(hasil);
}

// ================= TAMPIL =================
function tampilkan(data) {
  const div = document.getElementById("hasil");
  div.innerHTML = "";

  if (data.length === 0) {
    div.innerHTML = "<div class='done'>Semua siswa sudah tuntas 👍</div>";
    return;
  }

  // urutkan prioritas
  data.sort((a,b) => b.kurang.length - a.kurang.length);

  div.innerHTML += `<div class="summary">Total siswa belum tuntas: ${data.length}</div>`;

  data.forEach((siswa, index) => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="nama">${index+1}. ${siswa.nama} (${siswa.kurang.length} tugas)</div>
      <ul>
        ${siswa.kurang.map(k => `<li class="kurang">${k}</li>`).join("")}
      </ul>
    `;

    div.appendChild(card);
  });
}
</script>

</body>
</html>
