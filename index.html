<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Monitoring Siswa Auto</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; padding:20px; }
    .card {
      background:white;
      padding:15px;
      margin:10px 0;
      border-radius:10px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }
    .nama { font-weight:bold; }
    .kurang { color:red; }
  </style>
</head>
<body>

<h2>📊 Monitoring Tugas Siswa (Auto)</h2>

<div id="hasil">Loading data...</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/1Ldjko3p6M3XaUdi-uS9xZ-DhQpddddZYJNVVO_P2c-M/export?format=csv";

fetch(URL)
  .then(res => res.text())
  .then(text => {
    const data = parseCSV(text);
    prosesData(data);
  });

function parseCSV(text) {
  const rows = text.split("\n").map(r => r.split(","));
  const headers = rows[0];

  return rows.slice(1).map(row => {
    let obj = {};
    headers.forEach((h, i) => obj[h.trim()] = row[i]);
    return obj;
  });
}

function prosesData(data) {
  const hasil = data.map(row => {
    let kurang = [];

    if (!row["6.6"] || !row["6.7"]) {
      kurang.push("Mengerjakan aktivitas 6.6 dan 6.7 hal 21");
    }

    if (!row["Catatan"]) {
      kurang.push("Mencatat dan meringkas hal 8–21");
    }

    let asesmen = [];
    if (!row["I"]) asesmen.push("I");
    if (!row["II"]) asesmen.push("II");
    if (!row["III"]) asesmen.push("III");

    if (asesmen.length > 0) {
      kurang.push(`Mengerjakan asesmen ${asesmen.join(", ")} (hal 29–31)`);
    }

    return {
      nama: row["Nama"],
      kurang
    };
  }).filter(s => s.kurang.length > 0);

  tampilkan(hasil);
}

function tampilkan(data) {
  const div = document.getElementById("hasil");
  div.innerHTML = "";

  if (data.length === 0) {
    div.innerHTML = "<p>Semua siswa sudah tuntas 👍</p>";
    return;
  }

  data.forEach(siswa => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="nama">${siswa.nama}</div>
      <ul>
        ${siswa.kurang.map(k => `<li class="kurang">${k}</li>`).join("")}
      </ul>
    `;

    div.appendChild(card);
  });
}
</script>

</body>
</html>
