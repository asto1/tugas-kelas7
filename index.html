<script>
const URL = "https://docs.google.com/spreadsheets/d/1Ldjko3p6M3XaUdi-uS9xZ-DhQpddddZYJNVVO_P2c-M/export?format=csv";

loadData();
setInterval(loadData, 15000);

async function loadData() {
  try {
    const res = await fetch(URL);
    const text = await res.text();

    const data = parseCSV(text);
    prosesData(data);
  } catch (e) {
    document.getElementById("hasil").innerHTML = "❌ Gagal load data";
  }
}

function parseCSV(text) {
  const rows = text.split("\n").map(r => r.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/));

  const headers = rows[0].map(h => h.trim());

  return rows.slice(1).map(row => {
    let obj = {};
    headers.forEach((h, i) => {
      obj[h] = row[i] ? row[i].replace(/"/g, "").trim() : "";
    });
    return obj;
  });
}

function get(row, key) {
  const found = Object.keys(row).find(k => k.trim().toLowerCase() === key.toLowerCase());
  return found ? row[found] : "";
}

function kosong(val) {
  return !val || val === "" || val === "0";
}

function prosesData(data) {
  const hasil = data.map(row => {
    let kurang = [];

    if (kosong(get(row,"6.6")) || kosong(get(row,"6.7"))) {
      kurang.push("Mengerjakan aktivitas 6.6 dan 6.7 hal 21");
    }

    if (kosong(get(row,"Catatan"))) {
      kurang.push("Mencatat dan meringkas hal 8–21");
    }

    let asesmen = [];
    if (kosong(get(row,"I"))) asesmen.push("I");
    if (kosong(get(row,"II"))) asesmen.push("II");
    if (kosong(get(row,"III"))) asesmen.push("III");

    if (asesmen.length > 0) {
      kurang.push(`Mengerjakan asesmen ${asesmen.join(", ")} (hal 29–31)`);
    }

    return {
      nama: get(row,"Nama") || get(row,"Nama Siswa") || "-",
      kurang
    };
  }).filter(s => s.kurang.length > 0);

  tampilkan(hasil);
}

function tampilkan(data) {
  const div = document.getElementById("hasil");
  div.innerHTML = "";

  if (data.length === 0) {
    div.innerHTML = "<div style='text-align:center;color:green;font-weight:bold'>Semua siswa sudah tuntas 👍</div>";
    return;
  }

  data.forEach(siswa => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="nama">${siswa.nama}</div>
      <ul>
        ${siswa.kurang.map(k => `<li class="kurang">${k}</li>`).join("")}
      </ul>
    `;

    div.appendChild(card);
  });
}
</script>
