<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring Tugas Siswa</title>

<style>
body {
  font-family: Arial;
  background: #f4f6f9;
  padding: 20px;
}

h2 {
  text-align: center;
}

.info {
  text-align: center;
  color: #666;
  margin-bottom: 15px;
}

.summary {
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.card {
  background: white;
  padding: 15px;
  margin: 10px auto;
  border-radius: 10px;
  max-width: 650px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.nama {
  font-weight: bold;
  font-size: 15px;
}

.kelas {
  font-size: 13px;
  color: #555;
  margin-bottom: 8px;
}

.kurang {
  color: red;
}

.done {
  text-align:center;
  color: green;
  font-weight: bold;
}

button {
  display:block;
  margin: 15px auto;
  padding:10px 20px;
  border:none;
  border-radius:6px;
  background:#007bff;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#0056b3;
}
</style>
</head>

<body>

<h2>📊 Monitoring Tugas Siswa</h2>

<div class="info">
Berikut ini daftar siswa yang tugasnya belum tuntas.
</div>

<button onclick="toggleData()" id="btnToggle">Tampilkan Data</button>

<div id="hasil" style="display:none;">⏳ Memuat data...</div>

<script>
const URL = "https://docs.google.com/spreadsheets/d/1Ldjko3p6M3XaUdi-uS9xZ-DhQpddddZYJNVVO_P2c-M/export?format=csv";

loadData();
setInterval(loadData, 15000);

// ================= TOGGLE =================
function toggleData() {
  const div = document.getElementById("hasil");
  const btn = document.getElementById("btnToggle");

  if (div.style.display === "none") {
    div.style.display = "block";
    btn.innerText = "Sembunyikan Data";
  } else {
    div.style.display = "none";
    btn.innerText = "Tampilkan Data";
  }
}

// ================= LOAD =================
async function loadData() {
  try {
    const res = await fetch(URL);
    const text = await res.text();

    const data = parseCSV(text);
    prosesData(data);

  } catch (e) {
    document.getElementById("hasil").innerHTML = "❌ Gagal mengambil data";
  }
}

// ================= PARSER =================
function parseCSV(text) {
  const rows = text.split("\n")
    .map(r => r.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g))
    .filter(r => r && r.length > 0);

  const headerIndex = rows.findIndex(r =>
    r.some(c => c && c.toLowerCase().includes("nama"))
  );

  const headers = rows[headerIndex].map(h =>
    h.replace(/"/g,"").trim()
  );

  return rows.slice(headerIndex + 1).map(row => {
    let obj = {};
    headers.forEach((h, i) => {
      obj[h] = row[i] ? row[i].replace(/"/g,"").trim() : "";
    });
    return obj;
  });
}

// ================= HELPER =================
function belumTuntas(val) {
  if (!val) return true;

  val = val.toString().trim().toLowerCase();

  return !(val === "1" || val === "✓" || val === "v" || val === "done");
}

function getVal(row, key) {
  const found = Object.keys(row).find(k =>
    k.toLowerCase().includes(key.toLowerCase())
  );
  return found ? row[found] : "";
}

function ambilNama(row) {
  return getVal(row, "nama") || "-";
}

function ambilKelas(row) {
  return getVal(row, "kelas") || "-";
}

// ================= PROSES =================
function prosesData(data) {
  const hasil = data.map(row => {
    let kurang = [];

    if (belumTuntas(getVal(row, "6.6"))) {
      kurang.push("Aktivitas 6.6 & 6.7");
    }

    if (belumTuntas(getVal(row, "Catatan"))) {
      kurang.push("Catatan materi");
    }

    let asesmen = [];
    if (belumTuntas(getVal(row,"I"))) asesmen.push("I");
    if (belumTuntas(getVal(row,"II"))) asesmen.push("II");
    if (belumTuntas(getVal(row,"III"))) asesmen.push("III");

    if (asesmen.length > 0) {
      kurang.push(`Asesmen ${asesmen.join(", ")}`);
    }

    return {
      nama: ambilNama(row),
      kelas: ambilKelas(row),
      kurang
    };
  }).filter(s => s.kurang.length > 0);

  tampilkan(hasil);
}

// ================= TAMPIL =================
function tampilkan(data) {
  const div = document.getElementById("hasil");
  div.innerHTML = "";

  if (data.length === 0) {
    div.innerHTML = "<div class='done'>Semua siswa sudah tuntas 👍</div>";
    return;
  }

  data.sort((a,b) => b.kurang.length - a.kurang.length);

  div.innerHTML += `<div class="summary">Total belum tuntas: ${data.length}</div>`;

  data.forEach((siswa, index) => {
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="nama">${index+1}. ${siswa.nama}</div>
      <div class="kelas">Kelas: ${siswa.kelas}</div>
      <div><strong>${siswa.kurang.length} tugas</strong></div>
      <ul>
        ${siswa.kurang.map(k => `<li class="kurang">${k}</li>`).join("")}
      </ul>
    `;

    div.appendChild(card);
  });
}
</script>

</body>
</html>
